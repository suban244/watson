[project]
name = "watson"
version = "0.1.0"
description = "Watson - unified FastAPI + Discord bot service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.14.1",
    "SQLAlchemy>=2.0.50",
    "alembic>=1.18.4",
    "asyncpg==0.31.0",
    "psycopg[binary,pool]>=3.3.4",
    "sqlalchemy-paradedb>=0.6.0",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.2",
    "redis>=7.4.0",
    "logfire[fastapi,httpx,openai,sqlalchemy]>=4.33.0",
    "discord-py>=2.7.1",
    "pydantic-ai-slim[mistral,openrouter]>=2.0",
    "python-dateutil>=2.9.0.post0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "ruff>=0.9.10",
]

[tool.uv]
exclude-newer = "1 weeks"
