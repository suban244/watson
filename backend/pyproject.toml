[project]
name = "watson"
version = "0.1.0"
description = "Watson - unified FastAPI + Discord bot service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.14.1",
    "SQLAlchemy>=2.0.50",
    "alembic>=1.18.4",
    "asyncpg==0.31.0",
    "psycopg[binary,pool]>=3.3.4",
    "sqlalchemy-paradedb>=0.6.0",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.2",
    "redis>=7.4.0",
    "logfire[fastapi,httpx,openai,sqlalchemy]>=4.33.0",
    "discord-py>=2.7.1",
    "pydantic-ai-slim[mistral,openrouter]>=2.0",
    "python-dateutil>=2.9.0.post0",
    "greenlet>=3.5.1",
]

[dependency-groups]
# Tooling and notebook deps only — the Docker image builds with `--no-dev`.
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.4",
    "pyclean>=3.7.0",
    "ipykernel>=7.1.0",
    "marimo>=0.17.8",
    "mistralai>=1.9.11",
    "python-dotenv>=1.2.1",
    "httpx>=0.28.1",
]

[tool.ruff.lint]
extend-select = ["FBT"]

[tool.uv]
exclude-newer = "1 weeks"
